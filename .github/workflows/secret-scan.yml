# Secret scan for every push to this branch. It runs gitleaks on the commits of the branch.
# Pull requests to this branch are scanned by secret-scan.yml on main: GitHub always runs a pull_request_target
# workflow from the default branch. So this copy has no pull request trigger.
# The binary and its config stay in RUNNER_TEMP. The job name (secrets) is a required status check: if you rename
# the job, change the ruleset too.
name: secret-scan

on:
  push:
    branches: [deepseek-v41-tp2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
          printf '[extend]\nuseDefault = true\n' > gitleaks.toml
          mkdir -p no-ignore
      # The pushed commit, as data for the scan.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          path: scan
      # gitleaks also loads <source>/.gitleaksignore whatever --gitleaks-ignore-path says, so a commit could
      # hide its own leak with one. The job refuses such a file.
      - name: Refuse a .gitleaksignore in the checkout
        run: |
          if [ -e scan/.gitleaksignore ]; then
            echo "::error file=.gitleaksignore::remove .gitleaksignore: the secret scan does not accept repo ignores"
            exit 1
          fi
      # A .gitattributes in a commit could mark files -diff (binary). Then "git log -p" shows no content and
      # gitleaks finds nothing. .git/info/attributes has precedence over the files in the tree, and "* diff" sets a
      # text diff for each file.
      - name: Ignore the .gitattributes of the checkout
        run: |
          git -C scan config core.attributesFile /dev/null
          mkdir -p scan/.git/info
          echo '* diff' > scan/.git/info/attributes
      # --log-opts=HEAD: the commits of this branch only (the default is every branch).
      # --ignore-gitleaks-allow: a "gitleaks:allow" comment in a commit must not hide a finding.
      - name: gitleaks (all commits of this branch)
        run: >-
          "$RUNNER_TEMP/gitleaks" git scan --log-opts=HEAD --config "$RUNNER_TEMP/gitleaks.toml" --ignore-gitleaks-allow
          --gitleaks-ignore-path "$RUNNER_TEMP/no-ignore" --redact --no-banner --exit-code 1
