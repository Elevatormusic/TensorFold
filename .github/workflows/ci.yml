# Offline checks for every pull request into main and every push to main. main holds the repo files of the fork
# (templates, CI, policies); the engine branches have their own ci.yml with the tests.
# The job names (workflows) are required status checks of the main ruleset: if you rename a job, change
# the ruleset too. The secret scan is in secret-scan.yml: it must run from the base branch.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install actionlint and zizmor
        run: python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
      # actionlint: syntax, expressions and shell steps of each workflow.
      - name: actionlint
        run: actionlint -color
      # zizmor: security audit of each workflow (injection, unsafe triggers, unpinned or impostor actions).
      # A finding that is safe by design needs an inline "# zizmor: ignore[<audit>]" with the reason.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format github .github/workflows/
