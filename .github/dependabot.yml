# Dependabot opens a pull request when a pinned action or a CI lint tool has a new release.
# Each branch with workflows gets its own entry.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels: ["type: fix"]
    commit-message:
      prefix: ci
  - package-ecosystem: github-actions
    directory: /
    target-branch: deepseek-v41-tp2
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels: ["type: fix"]
    commit-message:
      prefix: ci
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    groups:
      ci-tools:
        patterns: ["*"]
    labels: ["type: fix"]
    commit-message:
      prefix: ci
  - package-ecosystem: pip
    directory: /.github
    target-branch: deepseek-v41-tp2
    schedule:
      interval: weekly
    groups:
      ci-tools:
        patterns: ["*"]
    labels: ["type: fix"]
    commit-message:
      prefix: ci
